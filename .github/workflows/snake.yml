name: Generate Snake

on:
  # Tự động chạy mỗi 24 giờ
  schedule:
    - cron: "0 0 * * *"
  # Cho phép bạn bấm chạy thủ công bằng nút "Run workflow"
  workflow_dispatch:
  # Tự động chạy mỗi khi bạn cập nhật code nhánh main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Bước sử dụng đoạn code của bạn để tạo ra các file ảnh snake
      - uses: Platane/snk@v3
        with:
          github_user_name: tan-thien
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      # Bước bắt buộc: Đẩy các file ảnh đã tạo ở trên lên nhánh "output" để hiển thị
      - name: push files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
