name: Generate Snake Game

on:
  # Tự động chạy mỗi ngày vào lúc 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Cho phép bạn chủ động bấm chạy thủ công bằng nút "Run workflow"
  workflow_dispatch:
  # Tự động chạy khi bạn thay đổi code ở nhánh main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Bước tạo file ảnh động chuẩn theo cấu hình tài liệu bạn gửi
      - uses: Platane/snk@v3
        with:
          github_user_name: tan-thien
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      # Bước đẩy 3 file ảnh trên (github-snake.svg, github-snake-dark.svg, ocean.gif) lên nhánh output
      - name: push files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
