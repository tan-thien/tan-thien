name: Generate Snake

on:
  # Tự động chạy mỗi 24 giờ
  schedule:
    - cron: "0 0 * * *"
  # Cho phép bạn bấm chạy thủ công bất cứ lúc nào
  workflow_dispatch:
  # Tự động chạy mỗi khi bạn push code lên nhánh main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Tạo file ảnh động snake.svg và github-contribution-grid-snake.svg
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Đẩy file ảnh đã tạo lên một nhánh tên là "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
